.tw1{animation:tw 3.2s ease-in-out infinite}
.tw2{animation:tw 4.6s ease-in-out 1.1s infinite}
.tw3{animation:tw 5.8s ease-in-out 2.3s infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.blink{animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rspin{to{transform:rotate(-360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes dash{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.flow{stroke-dasharray:4 9;animation:fl 1.4s linear infinite}@keyframes fl{to{stroke-dashoffset:-26}}
.bob{animation:bob 3.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pop1{animation:pop 6s ease infinite}.pop2{animation:pop 6s ease .8s infinite}.pop3{animation:pop 6s ease 1.6s infinite}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}
.glow1{animation:tw 2.4s ease-in-out infinite}.glow2{animation:tw 2.4s ease-in-out .8s infinite}.glow3{animation:tw 2.4s ease-in-out 1.6s infinite}
.drop{animation:drp 3.2s ease-in infinite}@keyframes drp{0%{transform:translateY(-12px);opacity:0}15%{opacity:1}60%{transform:translateY(46px);opacity:1}75%,100%{transform:translateY(62px);opacity:0}}.chk{animation:ck 3.2s ease infinite}@keyframes ck{0%,55%{stroke-dashoffset:50}80%,100%{stroke-dashoffset:0}}</style>
