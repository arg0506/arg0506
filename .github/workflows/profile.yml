name: Profile art

# Rebuilds the live cards used in README.md and publishes them to the
# `output` branch: stats.svg (custom stats card) + snake-alpona.svg.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Custom stats card (replaces the rate-limited public stats services).
      # Uses the built-in token; add a STATS_TOKEN secret (classic PAT, read:user)
      # only if you want private contributions counted.
      - name: Stats card
        continue-on-error: true
        run: node .github/scripts/stats-card.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          OUT: dist/stats.svg

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-alpona.svg?color_snake=#E9B44C&color_dots=#161E3D,#1F3B5C,#1F6F6A,#2EC4B6,#E9B44C&color_background=#0B1020
            dist/github-contribution-grid-snake-mono.svg?color_snake=#f2f0eb&color_dots=#161616,#2a2a2a,#555555,#8a8a8a,#f2f0eb&color_background=#0b0b0b

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
